<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marawade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <h2>MARAWADE</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#posts">Posts</a>
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
    </nav>
</header>

<section id="home" class="hero">
    <h1>Ku soo dhowow <span>Marawade</span></h1>
    <p>Halkan waxaad ka akhrisan kartaa oo aad ku daabici kartaa qoraallo.</p>
    <button class="main-btn" id="addPostBtn">+ Add Post</button>
</section>

<section id="dashboard" class="dashboard">
    <h2>Dashboard</h2>

    <form id="postForm">

        <input
            type="text"
            id="postTitle"
            placeholder="Cinwaanka qoraalka"
            required
        >

        <textarea
            id="postContent"
            placeholder="Qor qoraalkaaga..."
            required
        ></textarea>

        <input
            type="file"
            id="postImage"
            accept="image/*"
        >

        <button type="submit" class="main-btn">
            Publish
        </button>

    </form>
</section>

<section id="posts" class="posts-section">
    <h2>Qoraallada Marawade</h2>

    <div id="postsContainer"></div>
</section>

<footer>
    <p>© 2026 Marawade</p>
</footer>

<script src="script.js"></script>

</body>
</html>
